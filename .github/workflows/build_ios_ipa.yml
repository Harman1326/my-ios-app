name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    name: Build LoveMatch iOS
    runs-on: macos-14
    timeout-minutes: 60

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create iOS platform
        run: |
          flutter create --platforms=ios .

      - name: Get Flutter dependencies
        run: |
          flutter pub get

      - name: Build iOS
        run: |
          flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -r LoveMatch.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LoveMatch-iOS
          path: LoveMatch.ipa
